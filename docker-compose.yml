services:
  scrapling-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: scrapling-api:local
    container_name: scrapling-api
    # Default binding stays on loopback. Override with SCRAPLING_BIND=0.0.0.0
    # (or change to "8001:8001" directly) to expose on your LAN.
    ports:
      - "${SCRAPLING_BIND:-127.0.0.1}:8001:8001"
    environment:
      # Set a strong key whenever the API is reachable from anything other
      # than localhost (LAN, tunnel, internet...). Leave empty for local dev.
      SCRAPLING_API_KEY: "${SCRAPLING_API_KEY:-}"
      # Comma-separated origins to allow CORS, or "*". Empty disables CORS.
      SCRAPLING_CORS: "${SCRAPLING_CORS:-}"
    volumes:
      - ./data:/data
    restart: unless-stopped
    shm_size: "1gb"  # Chromium needs a roomy /dev/shm
